<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYPER CHESS ⚡</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; touch-action: manipulation; overflow-x: hidden;}
        h1 { color: #00f3ff; text-shadow: 0 0 15px #00f3ff; margin-top: 10px; font-size: 2.2rem; text-transform: uppercase;}
        
        .menu { background: #1a1a24; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; border: 2px solid #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
        input, select, button { width: 100%; box-sizing: border-box; background: #0f0f15; border: 2px solid #00f3ff; color: #fff; padding: 12px; margin: 8px 0; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.2s;}
        button:hover { background: #00f3ff; color: #000; box-shadow: 0 0 15px #00f3ff; }
        .btn-pink { border-color: #ff0055; color: #ff0055; }
        .btn-pink:hover { background: #ff0055; color: #000; box-shadow: 0 0 15px #ff0055; }
        
        #game-ui { display: none; max-width: 400px; margin: 0 auto; }
        .timer-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .timer { font-size: 2rem; font-family: monospace; font-weight: bold; background: #111; padding: 5px 15px; border-radius: 8px; border: 2px solid #333; }
        .timer.active { border-color: #ff0055; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        
        #board-wrapper { border: 4px solid #00f3ff; box-shadow: 0 0 20px rgba(0,243,255,0.5); border-radius: 5px; transition: 0.2s; }
        
        .gadgets { display: flex; gap: 8px; margin-top: 10px; }
        .gadget-btn { flex: 1; border-color: #00ff00; color: #00ff00; font-size: 0.8rem; padding: 12px 5px; text-transform: uppercase; }
        .gadget-btn:hover { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }
        .gadget-btn:disabled { opacity: 0.3; pointer-events: none; border-color: #555; color: #555; }

        /* DOPAMIN SCREEN SHAKE */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 4px) rotate(-1deg); }
            40% { transform: translate(4px, -4px) rotate(1deg); }
            60% { transform: translate(-4px, -4px) rotate(0deg); }
            80% { transform: translate(4px, 4px) rotate(-1deg); }
        }
        .shake { animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both; }

        .floating-text { position: absolute; font-size: 2.5rem; font-weight: 900; text-shadow: 0 0 15px currentColor; pointer-events: none; animation: floatUp 1s forwards; z-index: 1000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
    </style>
</head>
<body>

    <h1>⚡ HYPER CHESS ⚡</h1>

    <div id="menu" class="menu">
        <div id="menu-main">
            <button class="btn-pink" onclick="initHost()">👑 Spiel Erstellen (Host)</button>
            <hr style="border: 1px solid #333; margin: 25px 0;">
            <input type="text" id="join-code" placeholder="RAUM-CODE (z.B. A1B2)" style="text-align:center; text-transform:uppercase; letter-spacing: 3px; font-size: 1.3rem;">
            <button onclick="joinGame()">⚔️ Spiel Beitreten</button>
        </div>

        <div id="menu-host" style="display:none;">
            <h3 style="color:#ff0055;">Dein Raum-Code: <br><span id="host-code" style="font-size:3rem; letter-spacing: 5px; color:#fff; text-shadow: 0 0 15px #fff;">LÄDT...</span></h3>
            <p>Gib diesen Code deinem Gegner!</p>
            
            <select id="time-select">
                <option value="60+0">1 Min Bullet</option>
                <option value="120+0">2 Min Bullet</option>
                <option value="180+0">3 Min Blitz</option>
                <option value="300+0">5 Min Blitz</option>
                <option value="30+2">30s + 2s Fischer</option>
            </select>
            
            <select id="mode-select">
                <option value="classic">Modus: Classic Dopamin</option>
                <option value="atomic">Modus: Atomic (3x3 Explosion)</option>
                <option value="kamikaze">Modus: Antichess (Schlagzwang)</option>
            </select>
            
            <p style="color:#00f3ff; margin-top:20px; font-weight:bold;">Warte auf Gegner...</p>
        </div>
    </div>

    <div id="game-ui">
        <div class="timer-row">
            <div id="opp-timer" class="timer">00:00</div>
            <span style="color:#888; font-weight:bold;">GEGNER</span>
        </div>
        
        <div id="board-wrapper"><div id="board"></div></div>
        
        <div class="timer-row">
            <div id="my-timer" class="timer">00:00</div>
            <span style="color:#888; font-weight:bold;">DU</span>
        </div>

        <div class="gadgets">
            <button id="btn-time" class="gadget-btn" onclick="useGadget('time')">⏳ Zeitdieb</button>
            <button id="btn-freeze" class="gadget-btn" onclick="useGadget('freeze')" style="border-color:#00f3ff; color:#00f3ff;">🧊 Freeze</button>
            <button id="btn-nuke" class="gadget-btn" onclick="useGadget('nuke')" style="border-color:#ff0055; color:#ff0055;">💣 Nuke</button>
        </div>
    </div>

<script>
    let peer, conn;
    let game = new Chess(), board = null;
    let myColor = 'w', isMyTurn = false;
    let myTime = 60, oppTime = 60, increment = 0;
    let timerInterval, lastTime;
    let gameMode = 'classic';
    let gadgetsUsed = { time: false, nuke: false, freeze: false };
    let audioCtx;

    // --- AUDIO SYNTHESIZER ---
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'move') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'capture') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'gadget') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // --- MULTIPLAYER P2P (PeerJS) ---
    function initHost() {
        initAudio();
        let id = Math.random().toString(36).substring(2, 6).toUpperCase();
        peer = new Peer('HYPER-' + id);
        peer.on('open', () => {
            $('#host-code').text(id); $('#menu-main').hide(); $('#menu-host').show();
        });
        peer.on('connection', (c) => {
            conn = c; setupConnection();
            gameMode = $('#mode-select').val();
            let tc = $('#time-select').val().split('+');
            myTime = oppTime = parseInt(tc[0]); increment = parseInt(tc[1]);
            myColor = Math.random() > 0.5 ? 'w' : 'b';
            
            conn.on('open', () => {
                conn.send({ type: 'start', mode: gameMode, time: myTime, inc: increment, color: myColor === 'w' ? 'b' : 'w' });
                startGame();
            });
        });
    }

    function joinGame() {
        initAudio();
        let id = $('#join-code').val().toUpperCase();
        if(!id) return alert("Code eingeben!");
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect('HYPER-' + id);
            conn.on('open', setupConnection);
        });
    }

    function setupConnection() {
        conn.on('data', (data) => {
            if (data.type === 'start') {
                gameMode = data.mode; myTime = oppTime = data.time; increment = data.inc; myColor = data.color;
                startGame();
            } else if (data.type === 'move') {
                game.move(data.move); if(data.fen) game.load(data.fen);
                board.position(game.fen());
                myTime = data.oppTime; oppTime = data.myTime; // Uhren synchronisieren
                isMyTurn = true;
                
                if(data.captured) triggerDopamine(); else playSound('move');
                checkGameOver(); updateTimers();
            } else if (data.type === 'gadget') {
                playSound('gadget');
                if (data.gadget === 'time') {
                    myTime -= 10; oppTime += 10; showFloatingText("-10s!", "#ff0055");
                } else if (data.gadget === 'nuke') {
                    game.load(data.fen); board.position(game.fen());
                    triggerDopamine(); showFloatingText("NUKE!", "#ffaa00"); checkGameOver();
                } else if (data.gadget === 'freeze') {
                    showFloatingText("FROZEN!", "#00f3ff");
                    $('#board-wrapper').css('pointer-events', 'none').css('filter', 'hue-rotate(180deg) grayscale(80%)');
                    setTimeout(() => { $('#board-wrapper').css('pointer-events', 'auto').css('filter', 'none'); }, 3000);
                }
                updateTimers();
            }
        });
    }

    // --- SPIEL LOGIK ---
    function startGame() {
        $('#menu').hide(); $('#game-ui').show();
        isMyTurn = (myColor === 'w');
        
        board = Chessboard('board', {
            draggable: true, position: 'start', orientation: myColor === 'w' ? 'white' : 'black',
            onDragStart: (source, piece) => {
                if (game.game_over() || !isMyTurn) return false;
                if (piece.search(new RegExp(`^${myColor}`)) === -1) return false;
            },
            onDrop: handleDrop
        });
        
        $(window).resize(() => { if(board) board.resize(); }); // Responsive für Handy
        lastTime = Date.now(); timerInterval = setInterval(gameLoop, 100);
        updateTimers(); playSound('gadget');
    }

    function gameLoop() {
        if (game.game_over()) return;
        let now = Date.now(); let dt = (now - lastTime) / 1000; lastTime = now;
        
        if (isMyTurn) {
            myTime -= dt; if (myTime <= 0) { myTime = 0; gameOver("Zeit abgelaufen! Du verlierst."); }
        } else {
            oppTime -= dt; if (oppTime <= 0) { oppTime = 0; gameOver("Zeit abgelaufen! Du gewinnst!"); }
        }
        updateTimers();
    }

    function updateTimers() {
        const fmt = t => { let m = Math.floor(t / 60); let s = Math.floor(t % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; };
        $('#my-timer').text(fmt(myTime)).toggleClass('active', isMyTurn);
        $('#opp-timer').text(fmt(oppTime)).toggleClass('active', !isMyTurn);
    }

    function handleDrop(source, target) {
        // Antichess Schlagzwang Regel
        if (gameMode === 'kamikaze') {
            let captures = game.moves({verbose:true}).filter(m => m.captured);
            if (captures.length > 0 && !captures.find(m => m.from === source && m.to === target)) {
                showFloatingText("SCHLAGZWANG!", "#ff0055");
                return 'snapback';
            }
        }

        let move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';

        let captured = move.captured ? true : false;
        
        // Atomic Schach Regel
        if (gameMode === 'atomic' && captured) {
            let fIdx = "abcdefgh".indexOf(target[0]), rIdx = parseInt(target[1]);
            let sqs = [target];
            for(let df = -1; df <= 1; df++) {
                for(let dr = -1; dr <= 1; dr++) {
                    if(df === 0 && dr === 0) continue;
                    let f = fIdx + df, r = rIdx + dr;
                    if(f >= 0 && f <= 7 && r >= 1 && r <= 8) {
                        let sq = "abcdefgh"[f] + r; let p = game.get(sq);
                        if(p && p.type !== 'p') sqs.push(sq); // Bauern überleben
                    }
                }
            }
            sqs.forEach(sq => game.remove(sq));
            if (!game.fen().includes('K') || !game.fen().includes('k')) {
                setTimeout(() => gameOver("💥 KÖNIG EXPLODIERT! GAME OVER!"), 500);
            }
        }

        myTime += increment; isMyTurn = false;
        conn.send({ type: 'move', move: move, fen: game.fen(), myTime: myTime, oppTime: oppTime, captured: captured });
        board.position(game.fen());
        
        if (captured) triggerDopamine(); else playSound('move');
        checkGameOver(); updateTimers();
    }

    // --- GADGETS & DOPAMIN EFFEKTE ---
    function useGadget(type) {
        if (gadgetsUsed[type] || !isMyTurn || game.game_over()) return;
        gadgetsUsed[type] = true; $(`#btn-${type}`).prop('disabled', true);
        playSound('gadget');
        
        if (type === 'time') {
            myTime += 10; oppTime -= 10;
            conn.send({ type: 'gadget', gadget: 'time' });
            showFloatingText("+10s!", "#00ff00");
        } else if (type === 'nuke') {
            let targets = [];
            for (let f of 'abcdefgh') {
                for (let r = 1; r <= 8; r++) {
                    let p = game.get(f+r);
                    if (p && p.color !== myColor && p.type !== 'k') targets.push(f+r);
                }
            }
            if (targets.length > 0) {
                game.remove(targets[Math.floor(Math.random() * targets.length)]);
                board.position(game.fen());
                conn.send({ type: 'gadget', gadget: 'nuke', fen: game.fen() });
                triggerDopamine(); showFloatingText("NUKE!", "#ffaa00"); checkGameOver();
            }
        } else if (type === 'freeze') {
            conn.send({ type: 'gadget', gadget: 'freeze' });
            showFloatingText("FREEZE!", "#00f3ff");
        }
        updateTimers();
    }

    function triggerDopamine() {
        playSound('capture');
        $('#board-wrapper').removeClass('shake');
        void document.getElementById('board-wrapper').offsetWidth; // Reflow erzwingen
        $('#board-wrapper').addClass('shake');
        confetti({ particleCount: 200, spread: 360, startVelocity: 40, colors: ['#ff0055', '#00f3ff', '#ffaa00', '#ffffff'] });
    }

    function showFloatingText(text, color) {
        let el = $('<div class="floating-text"></div>').text(text).css('color', color);
        let b = $('#board-wrapper');
        el.css({ left: b.offset().left + b.width() / 2 - 80, top: b.offset().top + b.height() / 2 - 20 });
        $('body').append(el);
        setTimeout(() => el.remove(), 1000);
    }

    function checkGameOver() {
        if (game.game_over()) gameOver(game.in_checkmate() ? "Schachmatt!" : "Unentschieden!");
    }

    function gameOver(msg) {
        clearInterval(timerInterval);
        setTimeout(() => { alert(msg); location.reload(); }, 300);
    }
</script>
</body>
</html>
